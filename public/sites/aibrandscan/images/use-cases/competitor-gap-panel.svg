<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Competitor visibility gap infographic</title>
  <desc id="desc">A light comparison dashboard showing competitors winning more AI visibility than your brand.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#9a3412" flood-opacity=".12"/>
    </filter>
  </defs>
  <g transform="translate(96 84)" filter="url(#soft)">
    <rect width="1008" height="507" rx="34" fill="#f8fafc"/>
    <g transform="translate(54 52)">
      <text x="0" y="42" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" fill="#0f172a">Competitor visibility gap</text>
      <text x="0" y="82" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">See where AI recommends competitors instead of your brand.</text>
      <g transform="translate(0 136)">
        <rect width="420" height="270" rx="28" fill="#ffffff" stroke="#fed7aa"/>
        <text x="32" y="56" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Your brand</text>
        <circle cx="88" cy="130" r="48" fill="#fff7ed" stroke="#ffb86b" stroke-width="10"/>
        <text x="88" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#9a3412">22%</text>
        <text x="32" y="218" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Mentioned in fewer</text>
        <text x="32" y="246" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">buyer-intent answers</text>
      </g>
      <g transform="translate(486 136)">
        <rect width="420" height="270" rx="28" fill="#fff7ed" stroke="#fdba74"/>
        <text x="32" y="56" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Competitors</text>
        <g transform="translate(32 96)">
          <rect width="300" height="22" rx="11" fill="#fed7aa"/>
          <rect width="250" height="22" rx="11" fill="#f97316"/>
          <text x="318" y="19" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">58%</text>
        </g>
        <g transform="translate(32 150)">
          <rect width="300" height="22" rx="11" fill="#fed7aa"/>
          <rect width="210" height="22" rx="11" fill="#ff5a1f"/>
          <text x="318" y="19" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">49%</text>
        </g>
        <g transform="translate(32 204)">
          <rect width="300" height="22" rx="11" fill="#fed7aa"/>
          <rect width="168" height="22" rx="11" fill="#fb923c"/>
          <text x="318" y="19" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">33%</text>
        </g>
      </g>
      <path d="M430 270h44" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
      <path d="M462 254l18 16-18 16" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
